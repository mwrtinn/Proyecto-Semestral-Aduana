# Nombre del microservicio
spring.application.name=ms-menores
server.port=8083

# Conexión a la base de datos (Docker)
# db-usuario es el nombre del contenedor de MySQL en tu docker-compose
spring.datasource.url=jdbc:mysql://db_menor:3306/db_menor?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root_password

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

usuarios.service.url=http://${USUARIOS_HOST:localhost}:8080/api/v1/usuarios

# --- Configuración de Swagger / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method