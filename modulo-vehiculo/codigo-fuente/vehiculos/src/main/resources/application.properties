# Nombre del microservicio
spring.application.name=ms-vehiculos
server.port=8081

# Conexión a la base de datos (Docker)
spring.datasource.url=jdbc:mysql://db_vehiculo:3306/db_vehiculo?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root_password

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

usuarios.service.url=http://host.docker.internal:8080/api/v1/usuarios

# Swagger UI / OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html