server:
  port: 8081

spring:
  application:
    name: MS-VEHICULO
  datasource:
    url: jdbc:mysql://db_vehiculo:3306/db_vehiculo?createDatabaseIfNotExist=true
    username: root
    password: root_password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /doc/swagger-ui.html

eureka:
  client:
    service-url:
      defaultZone: http://ms-eureka:8761/eureka/
  instance:
    prefer-ip-address: true
    ip-address: 172.31.88.139  