# Nombre del microservicio
spring.application.name=ms-vehiculos
server.port=8080

# Conexión a la base de datos (Docker)
# db-usuario es el nombre del contenedor de MySQL en tu docker-compose
spring.datasource.url=jdbc:mysql://db_vehiculo:3306/db_vehiculo?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root_password

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect