    ports: ["33062:3306"]
    networks: [red_aduana]
    volumes:
      - vol_db_mascota:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  ms-mascota:
