    container_name: ms_mascota
    ports: ["8082:8080"]
    depends_on:
      db-mascota:
        condition: service_healthy
      ms-usuario:
        condition: service_started
    environment:
      - USUARIOS_HOST=ms_usuario
    volumes: ["./modulo-mascota/codigo-fuente:/app"]
    command: tail -f /dev/null
    networks: [red_aduana]
    working_dir: /app

  # ==========================================
  # 4. MÓDULO MENOR
