version: '3.8'

services:
  # ==========================================
  # 1. MÓDULO USUARIO
  # ==========================================
  db-usuario:
    image: mysql:8.0
    container_name: db_usuario
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: db_usuario
    ports: ["33060:3306"]
    networks: [red_aduana]
    volumes:
      - vol_db_usuario:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  ms-usuario:
    image: maven:3.9-eclipse-temurin-21
    container_name: ms_usuario
    ports: ["8080:8080"]
    depends_on:
      db-usuario:
        condition: service_healthy
    volumes: ["./modulo-usuario/codigo-fuente:/app"]
    command: tail -f /dev/null
    networks: [red_aduana]
    working_dir: /app

  # ==========================================
  # 2. MÓDULO VEHÍCULO
  # ==========================================
  db-vehiculo:
    image: mysql:8.0
    container_name: db_vehiculo
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: db_vehiculo
    ports: ["33061:3306"]
    networks: [red_aduana]
    volumes:
      - vol_db_vehiculo:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  ms-vehiculo:
    image: maven:3.9-eclipse-temurin-21
    container_name: ms_vehiculo
    ports: ["8081:8080"]
    depends_on:
      db-vehiculo:
        condition: service_healthy
      ms-usuario:
        condition: service_started
    environment:
      - USUARIOS_HOST=ms_usuario
    volumes: ["./modulo-vehiculo/codigo-fuente:/app"]
    command: tail -f /dev/null
    networks: [red_aduana]
    working_dir: /app

  # ==========================================
  # 3. MÓDULO MASCOTA
