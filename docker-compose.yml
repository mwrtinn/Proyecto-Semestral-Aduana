version: '3.8'

services:
  # ==========================================
  # 0. SERVICIO DE DESCUBRIMIENTO (EUREKA)
  # ==========================================
  ms-eureka:
    image: maven:3.9-eclipse-temurin-21
    container_name: ms_eureka
    ports: ["8761:8761"]
    networks: [red_aduana]
    volumes: ["./modulo-eureka/codigo-fuente:/app"]
    command: tail -f /dev/null
    working_dir: /app

  # ==========================================
  # MÓDULOS DE NEGOCIO Y BASES DE DATOS
  # ==========================================
  
  # 1. USUARIO
  db-usuario:
    image: mysql:8.0
    container_name: db_usuario
    environment: {MYSQL_ROOT_PASSWORD: root_password, MYSQL_DATABASE: db_usuario}
    networks: [red_aduana]
    volumes: [vol_db_usuario:/var/lib/mysql]
  ms-usuario:
    image: maven:3.9-eclipse-temurin-21
    container_name: ms_usuario
    ports: ["8080:8080"]
    depends_on: [ms-eureka, db-usuario]
    volumes: ["./modulo-usuario/codigo-fuente:/app"]
    command: tail -f /dev/null
    networks: [red_aduana]
    working_dir: /app

  # 2. VEHÍCULO
  db-vehiculo:
    image: mysql:8.0
    container_name: db_vehiculo
    environment: {MYSQL_ROOT_PASSWORD: root_password, MYSQL_DATABASE: db_vehiculo}
    networks: [red_aduana]
    volumes: [vol_db_vehiculo:/var/lib/mysql]
  ms-vehiculo:
    image: maven:3.9-eclipse-temurin-21
    container_name: ms_vehiculo
    ports: ["8081:8080"]
    depends_on: [ms-eureka, db-vehiculo, ms-usuario]
    volumes: ["./modulo-vehiculo/codigo-fuente:/app"]
    command: tail -f /dev/null
    networks: [red_aduana]
    working_dir: /app

  # 3. MASCOTA
  db-mascota:
    image: mysql:8.0
    container_name: db_mascota
    environment: {MYSQL_ROOT_PASSWORD: root_password, MYSQL_DATABASE: db_mascota}
    networks: [red_aduana]
    volumes: [vol_db_mascota:/var/lib/mysql]
  ms-mascota:
    image: maven:3.9-eclipse-temurin-21
    container_name: ms_mascota
    ports: ["8082:8080"]
    depends_on: [ms-eureka, db-mascota, ms-usuario]
    volumes: ["./modulo-mascota/codigo-fuente:/app"]
    command: tail -f /dev/null
    networks: [red_aduana]
    working_dir: /app

  # 4. MENOR
  db-menor:
    image: mysql:8.0
    container_name: db_menor
    environment: {MYSQL_ROOT_PASSWORD: root_password, MYSQL_DATABASE: db_menor}
    networks: [red_aduana]
    volumes: [vol_db_menor:/var/lib/mysql]
  ms-menor:
    image: maven:3.9-eclipse-temurin-21
    container_name: ms_menor
    ports: ["8083:8080"]
    depends_on: [ms-eureka, db-menor, ms-usuario]
    volumes: ["./modulo-menor/codigo-fuente:/app"]
    command: tail -f /dev/null
    networks: [red_aduana]
    working_dir: /app

  # 5. DECLARACIÓN
  db-declaracion:
    image: mysql:8.0
    container_name: db_declaracion
    environment: {MYSQL_ROOT_PASSWORD: root_password, MYSQL_DATABASE: db_declaracion}
    networks: [red_aduana]
    volumes: [vol_db_declaracion:/var/lib/mysql]
  ms-declaracion:
    image: maven:3.9-eclipse-temurin-21
    container_name: ms_declaracion
    ports: ["8084:8080"]
    depends_on: [ms-eureka, db-declaracion, ms-usuario, ms-vehiculo, ms-mascota, ms-menor]
    volumes: ["./modulo-declaracion/codigo-fuente:/app"]
    command: tail -f /dev/null
    networks: [red_aduana]
    working_dir: /app

  # 6. ADUANA-ARG
  db-aduana:
    image: mysql:8.0
    container_name: db_aduana
    environment: {MYSQL_ROOT_PASSWORD: root_password, MYSQL_DATABASE: db_aduana}
    networks: [red_aduana]
    volumes: [vol_db_aduana:/var/lib/mysql]
  ms-aduana:
    image: maven:3.9-eclipse-temurin-21
    container_name: ms_aduana
    ports: ["8085:8080"]
    depends_on: [ms-eureka, db-aduana, ms-declaracion]
    volumes: ["./modulo-aduana-arg/codigo-fuente:/app"]
    command: tail -f /dev/null
    networks: [red_aduana]
    working_dir: /app

  # 7. CORREO
  db-correo:
    image: mysql:8.0
    container_name: db_correo
    environment: {MYSQL_ROOT_PASSWORD: root_password, MYSQL_DATABASE: db_correo}
    networks: [red_aduana]
    volumes: [vol_db_correo:/var/lib/mysql]
  ms-correo:
    image: maven:3.9-eclipse-temurin-21
    container_name: ms_correo
    ports: ["8086:8080"]
    depends_on: [ms-eureka, db-correo, ms-declaracion]
    volumes: ["./modulo-correo/codigo-fuente:/app"]
    command: tail -f /dev/null
    networks: [red_aduana]
    working_dir: /app

  # 8. QR
  db-qr:
    image: mysql:8.0
    container_name: db_qr
    environment: {MYSQL_ROOT_PASSWORD: root_password, MYSQL_DATABASE: db_qr}
    networks: [red_aduana]
    volumes: [vol_db_qr:/var/lib/mysql]
  ms-qr:
    image: maven:3.9-eclipse-temurin-21
    container_name: ms_qr
    ports: ["8087:8080"]
    depends_on: [ms-eureka, db-qr, ms-declaracion]
    volumes: ["./modulo-qr/codigo-fuente:/app"]
    command: tail -f /dev/null
    networks: [red_aduana]
    working_dir: /app

  # 9. REPORTE
  db-reporte:
    image: mysql:8.0
    container_name: db_reporte
    environment: {MYSQL_ROOT_PASSWORD: root_password, MYSQL_DATABASE: db_reporte}
    networks: [red_aduana]
    volumes: [vol_db_reporte:/var/lib/mysql]
  ms-reporte:
    image: maven:3.9-eclipse-temurin-21
    container_name: ms_reporte
    ports: ["8088:8080"]
    depends_on: [ms-eureka, db-reporte, ms-declaracion]
    volumes: ["./modulo-reporte/codigo-fuente:/app"]
    command: tail -f /dev/null
    networks: [red_aduana]
    working_dir: /app

  # 10. TURNO
  db-turno:
    image: mysql:8.0
    container_name: db_turno
    environment: {MYSQL_ROOT_PASSWORD: root_password, MYSQL_DATABASE: db_turno}
    networks: [red_aduana]
    volumes: [vol_db_turno:/var/lib/mysql]
  ms-turno:
    image: maven:3.9-eclipse-temurin-21
    container_name: ms_turno
    ports: ["8089:8080"]
    depends_on: [ms-eureka, db-turno]
    volumes: ["./modulo-turno/codigo-fuente:/app"]
    command: tail -f /dev/null
    networks: [red_aduana]
    working_dir: /app

volumes:
  vol_db_usuario:
  vol_db_vehiculo:
  vol_db_mascota:
  vol_db_menor:
  vol_db_declaracion:
  vol_db_aduana:
  vol_db_correo:
  vol_db_qr:
  vol_db_reporte:
  vol_db_turno:

networks:
  red_aduana:
    driver: bridge