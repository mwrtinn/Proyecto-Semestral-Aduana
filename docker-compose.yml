        condition: service_healthy
      ms-usuario:
        condition: service_started
      ms-vehiculo:
        condition: service_started
      ms-mascota:
        condition: service_started
      ms-menor:
        condition: service_started
    environment:
      - USUARIOS_HOST=ms_usuario
      - VEHICULOS_HOST=ms_vehiculo
