  vol_db_usuario:
  vol_db_vehiculo:
  vol_db_mascota:
  vol_db_menor:
  vol_db_declaracion:
  vol_db_aduana:
  vol_db_correo:
  vol_db_qr:
  vol_db_reporte:
  vol_db_turno:

# ==========================================
# Red Interna de Docker
# ==========================================
networks:
  red_aduana:
    driver: bridge