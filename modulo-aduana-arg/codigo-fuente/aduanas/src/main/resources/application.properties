# Nombre del microservicio
spring.application.name=ms-aduana
server.port=8085

# Conexión a la base de datos (Docker)
# Se usa el host parametrizado para compatibilidad local/Docker
spring.datasource.url=jdbc:mysql://db_aduana:3306/db_aduana?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root_password

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# URL del Microservicio de Usuarios para Feign Client
usuarios.service.url=${USUARIOS_URL:http://ms-usuario:8080/api/v1/usuarios}